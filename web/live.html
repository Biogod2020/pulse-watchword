<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse · tell it what to watch for</title>
<meta property="og:title" content="Pulse — tell your camera what to watch for, in plain words">
<style>@font-face{font-family:"Inter";src:url("/fonts/InterVariable.ttf") format("truetype");font-weight:100 900;font-display:swap}

:root{--bg:#070b16;--panel:#0f1629;--line:#1d2742;--ink:#e6e9f2;--mut:#8b95ad;--cyan:#22d3ee;--violet:#a78bfa;--green:#34d399;--amber:#fbbf24;--rose:#fb7185}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:radial-gradient(1200px 600px at 10% -10%,#16204a 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#2a1650 0,transparent 55%),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.5 "Inter",-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-feature-settings:"cv11","ss01"}
button{font:inherit;cursor:pointer}input{font:inherit}
.top{display:flex;align-items:center;gap:14px;padding:14px 22px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:.3px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 0 rgba(34,211,238,.7);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,211,238,.6)}70%{box-shadow:0 0 0 14px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}
.tag{color:var(--mut);font-size:13px}
.eng{display:none;margin-left:12px;padding:3px 10px 3px 8px;border:1px solid rgba(255,255,255,.14);border-radius:99px;font-size:12px;color:var(--mut)}
.eng.on{display:inline-flex;align-items:center;gap:6px}.eng.on::before{content:"";width:7px;height:7px;border-radius:50%;background:#0a7cff}
.top .sp{flex:1}.pill{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px}
.counter{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px}.counter b{color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(340px,1fr);gap:18px;padding:0 22px 22px;height:calc(100vh - 64px)}
.left{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0}
.stage{position:relative;border-radius:22px;overflow:hidden;background:#000;border:1px solid var(--line);aspect-ratio:16/9;width:100%;flex:none}
.stage video{width:100%;height:100%;object-fit:cover;display:block}
.hud{position:absolute;left:16px;top:16px;display:flex;gap:8px;align-items:center;background:rgba(7,11,22,.6);backdrop-filter:blur(8px);border-radius:999px;padding:6px 12px;font-size:13px}
.rec{width:9px;height:9px;border-radius:50%;background:var(--rose);animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.25}}
.live{flex:1;min-height:0;display:flex;flex-direction:column}.meters{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0}
.meter{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 52px;align-items:center;gap:4px 16px;background:#0a1122;border:1px solid transparent;border-radius:12px;padding:10px 14px;transition:all .25s}
.meter .n{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meter svg{width:100%;height:46px;display:block}.meter svg .th{stroke:rgba(255,255,255,.18);stroke-dasharray:3 4}.meter svg .ln{fill:none;stroke:var(--cyan);stroke-width:2;vector-effect:non-scaling-stroke}.meter svg .ar{fill:rgba(34,211,238,.12)}.meter.on svg .ln{stroke:var(--green)}.meter .v{text-align:right;font-variant-numeric:tabular-nums;font-size:15px;color:var(--mut)}.meter.on .v{color:var(--green);font-weight:700}.meter .b{height:6px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}.meter .b i{display:block;height:100%;background:var(--cyan);transition:width .35s}
.meter.on{border-color:var(--green);box-shadow:0 0 24px rgba(52,211,153,.35)}.meter.on .b i{background:var(--green)}
.flash{position:absolute;inset:0;pointer-events:none;border:6px solid var(--green);border-radius:22px;opacity:0}
.flash.go{animation:flash 1.1s ease-out}@keyframes flash{0%{opacity:1}100%{opacity:0}}
.toast{position:absolute;left:50%;top:22px;transform:translate(-50%,-30px);opacity:0;background:rgba(15,22,41,.92);border:1px solid var(--green);border-radius:16px;padding:10px 16px;font-weight:700;transition:all .35s;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}
.check{position:absolute;left:50%;top:22px;transform:translate(-50%,-30px);opacity:0;background:rgba(20,14,46,.92);border:1px solid #7c5cff;color:#ddd6fe;border-radius:16px;padding:10px 16px;font-weight:650;transition:all .3s;white-space:nowrap;display:flex;align-items:center;gap:10px}
.check.show{transform:translate(-50%,0);opacity:1}.check i{width:10px;height:10px;border-radius:50%;background:#a78bfa;animation:blink .8s infinite}
.check.no{border-color:#475569;color:#94a3b8}.check.no i{background:#64748b;animation:none}
.replay{position:absolute;inset:0;opacity:0;transition:opacity .45s;pointer-events:none}.replay.show{opacity:1}
.replay img{width:100%;height:100%;object-fit:cover;display:block}
.replay span{position:absolute;right:16px;top:16px;background:rgba(20,14,46,.88);border:1px solid #7c5cff;color:#ddd6fe;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600}
.side{display:flex;flex-direction:column;gap:14px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px}
.card h3{margin:0 0 10px;font-size:14px;color:#c7cde0;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.ask{display:flex;gap:8px}.ask input{flex:1;background:#0a1122;border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:12px 14px;outline:none}
.ask input:focus{border-color:var(--cyan)}
.btn{white-space:nowrap;border:0;border-radius:14px;padding:0 16px;font-weight:700;background:var(--cyan);color:#05212a}
.btn.v{background:var(--violet);color:#1d0f3d}.btn.ghost{background:#16203a;color:var(--ink)}
.mic{width:46px;border-radius:14px;border:1px solid var(--line);background:#0a1122;color:var(--ink)}
.mic.on{background:var(--rose);color:#fff;border-color:var(--rose)}
.ideas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.ideas span{font-size:12.5px;border:1px dashed #33406a;color:#b6bfd6;border-radius:999px;padding:4px 10px;cursor:pointer}
.ideas span:hover{border-color:var(--cyan);color:var(--ink)}
.wlist{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:190px;overflow:auto}
.w.new{border:1px solid var(--cyan)}
.w>span{min-width:0}
.w{display:grid;grid-template-columns:minmax(0,1fr) 90px 26px;gap:8px;align-items:center;font-size:13.5px;background:#0a1122;border-radius:12px;padding:8px 10px}
.w .q{color:var(--mut);font-size:11.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w.new .q{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
body.simple .tech,body.simple .meter .v,body.simple [data-i=liveHint],body.simple .counter,body.simple .w .q{display:none}
body.simple .w input[type=range]{opacity:0;transition:opacity .2s}body.simple .w:hover input[type=range]{opacity:1}
.w input[type=range]{width:90px;accent-color:var(--cyan)}.w .x{background:none;border:0;color:var(--mut)}
.feed{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;display:flex;gap:10px;align-items:stretch}
.mo{flex:0 0 auto;height:100%;display:flex;flex-direction:column;background:#0a1122;border-radius:14px;overflow:hidden;border:1px solid var(--line);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.mo img{height:calc(100% - 44px);width:auto;display:block;aspect-ratio:4/5;object-fit:cover;cursor:zoom-in}
.mo .a{display:flex;gap:6px;padding:8px;width:0;min-width:100%;box-sizing:border-box}.mo .a button{flex:1;border:0;border-radius:10px;padding:6px 0;font-size:12px;background:#16203a;color:var(--ink)}
.mo .a button.s{background:var(--green);color:#052e1f;font-weight:700}
.empty{color:var(--mut);font-size:13px;grid-column:1/-1;padding:16px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.answer{margin-top:10px;background:#140e2e;border:1px solid #3b2a73;border-radius:14px;padding:10px 12px;display:none;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.answer img{grid-row:1/span 2;grid-column:2;width:150px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;cursor:zoom-in}.answer .m{color:var(--mut);font-size:12px}
.foot{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.foot button{background:none;border:0;color:var(--rose);padding:0;font-size:12px;text-decoration:underline}
.gate{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(800px 500px at 50% 30%,#1a2550,var(--bg));z-index:20}
.gate .box{max-width:620px;text-align:center;padding:24px}
.gate h1{font-size:44px;line-height:1.1;margin:18px 0 10px;letter-spacing:-.5px}
.gate h1 em{font-style:normal;background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.gate p{color:#b6bfd6;font-size:17px}.gate .go{margin-top:22px;height:54px;padding:0 28px;font-size:17px;border-radius:16px}
.gate small{display:block;margin-top:16px;color:var(--mut)}
.err{color:var(--rose);margin-top:12px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:30}.lb img,.lb video{max-height:88vh;max-width:92vw;border-radius:16px}
.mo .a a{flex:1;display:flex}.mo .a a button{width:100%}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr);height:auto;padding:0 12px 16px}.top{padding:12px}.top .tag,.counter{display:none}.feed{flex:none;height:300px}.side{min-width:0}.meters{flex-wrap:nowrap;overflow-x:auto}.w{grid-template-columns:minmax(0,1fr) 70px 22px}.w input[type=range]{width:70px}}
</style></head><body>
<div class="gate" id="gate"><div class="box">
  <div class="logo" style="justify-content:center"><span class="dot"></span>Pulse</div>
  <h1 data-i="hero">告诉你的摄像头<br><em>要帮你盯着什么</em></h1>
  <p data-i="sub">用一句话说：“我喝水的时候提醒我”“有人在我身后经过时告诉我”。它一直在看，但只在需要时才动脑。</p>
  <button class="btn go" id="start" data-i="startBtn">打开摄像头，开始</button>
  <small data-i="privacy">画面只在内存里保留 3 分钟；只有你让它记住的瞬间才会存下来，随时一键全部删除。</small>
  <div class="err" id="gateErr"></div>
</div></div>

<div class="top"><div class="logo"><span class="dot"></span>Pulse</div><span class="tag" data-i="tagline">always watching, rarely thinking</span><span class="eng" id="engine"></span><span class="sp"></span>
  <span class="counter" id="counter"></span><button class="pill" id="details">details</button><button class="pill" id="lang">EN</button></div>
<main>
  <section class="left"><div class="stage"><video id="video" autoplay playsinline muted></video>
    <div class="hud"><span class="rec"></span><span id="hud">watching</span></div>
    <div class="replay" id="replay"><img><span></span></div><div class="flash" id="flash"></div><div class="toast" id="toast"></div><div class="check" id="check"><i></i><span></span></div></div>
    <div class="card live"><h3>📈 <span data-i="liveTitle">此刻</span><span class="sp" style="flex:1"></span><span class="tag" data-i="liveHint">每秒读一次最近 2 秒</span></h3><div class="meters" id="meters"></div></div></section>
  <section class="side">
    <div class="card"><h3>👀 <span data-i="watchTitle">让它帮你盯着</span></h3>
      <div class="ask"><input id="watchIn" data-ph="watchPh" placeholder="提醒我……（例如：我喝水的时候）"><button class="mic" id="watchMic" title="voice"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button class="btn" id="watchGo" data-i="add">添加</button></div>
      <div class="ideas" id="ideas"></div>
      <div class="wlist" id="wlist"></div></div>
    <div class="card" style="flex:1;display:flex;flex-direction:column;min-height:240px"><h3>✨ <span data-i="momentsTitle">它注意到的瞬间</span><span class="sp" style="flex:1"></span><span class="tag" id="storage"></span></h3>
      <div class="feed" id="feed"><div class="empty" data-i="noMoments">还没有。试试对镜头挥挥手 👋</div></div></div>
    <div class="card"><h3>💬 <span data-i="askTitle">问它</span></h3>
      <div class="ask"><input id="askIn" data-ph="askPh" placeholder="我的钥匙放哪了？刚才发生了什么？"><button class="mic" id="askMic" title="voice"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button class="btn v" id="askGo" data-i="ask">问</button></div>
      <div class="answer" id="answer"></div>
      <div class="foot" style="margin-top:10px"><span data-i="foot">画面只在内存里保留 3 分钟，只存下瞬间。</span><button id="forget" data-i="forget">全部忘掉</button></div></div>
  </section>
</main>
<div class="lb" id="lb"></div>
<script>
const T={zh:{hero:'告诉你的摄像头<br><em>要帮你盯着什么</em>',sub:'用一句话说：“我喝水的时候提醒我”“有人在我身后经过时告诉我”。它一直在看，但只在需要时才动脑。',startBtn:'打开摄像头，开始',privacy:'画面只在内存里保留 3 分钟；只有你让它记住的瞬间才会存下来，随时一键全部删除。',tagline:'一直在看，很少动脑',watchTitle:'让它帮你盯着',watchPh:'提醒我……（例如：我喝水的时候）',add:'添加',momentsTitle:'它注意到的瞬间',noMoments:'还没有。试试对镜头挥挥手 👋',askTitle:'问它',askPh:'我的钥匙放哪了？刚才发生了什么？',ask:'问',foot:'画面只在内存里保留 3 分钟，只存下瞬间和每 30 秒一张快照。',forget:'全部忘掉',watching:'正在看',liveTitle:'此刻',liveHint:'每秒读一次最近 2 秒 · 虚线 = 0.5 候选线',counter:(f,b,c,d)=>`看了 <b>${f}</b> 帧 · 核实 <b>${c}</b> 次（否决 ${d}）· 动脑 <b>${b}</b> 次`,ideas:['我喝水的时候','我站起来离开座位','有人从我身后走过','我的猫跳上桌子','我拿起手机','我打哈欠'],adding:'正在把这句话变成一个问题…',noticed:'注意到：',share:'分享',card:'卡片',clip:'视频',thinking:'想一想，顺便回看画面…',denied:'需要摄像头权限。如果是远程服务器，请用 localhost 端口转发打开（见 README）。',sens:'灵敏度',answered:s=>`${s.toFixed(1)} 秒作答`,second:l=>`确认一下：${l}…`,notQuite:l=>`不是：${l}`,seenAgo:s=>s!=null?`回看 · ${s} 秒前`:'回看',seenOnly:s=>`${s} 秒前看到`,fromScan:(n,s)=>`回看了 ${n} 帧`+(s!=null?` · ${s} 秒前看到`:'')},
en:{hero:'Tell your camera<br><em>what to watch for</em>',sub:'In plain words: “tell me when I drink water”, “let me know if someone walks behind me”. It is always watching, but only thinks when it needs to.',startBtn:'Turn on camera',privacy:'Frames live in memory for 3 minutes. Only the moments you asked for are kept, and one click forgets everything.',tagline:'always watching, rarely thinking',watchTitle:'Watch for',watchPh:'Tell me when… (e.g. I drink water)',add:'Add',momentsTitle:'Moments',noMoments:'Nothing yet. Try waving at the camera 👋',askTitle:'Ask',askPh:'Where did I leave my keys? What just happened?',ask:'Ask',foot:'Frames stay in memory for 3 minutes; only moments and a snapshot every 30 s are kept.',forget:'Forget everything',watching:'watching',liveTitle:'Right now',liveHint:'reads the last 2 s, every second · dashed line = 0.5',counter:(f,b,c,d)=>`watched <b>${f}</b> frames · checked <b>${c}</b> (${d} dismissed) · thought <b>${b}</b> times`,ideas:['I drink water','I stand up and leave my desk','someone walks behind me','my cat jumps on the desk','I pick up my phone','I yawn'],adding:'Turning that into a question…',noticed:'Noticed: ',share:'Share',card:'Card',clip:'Clip',thinking:'Thinking, and looking back…',denied:'Camera permission is needed. On a remote server, open it through a localhost port forward (see README).',sens:'sensitivity',answered:s=>`answered in ${s.toFixed(1)}s`,second:l=>`Checking: ${l}…`,notQuite:l=>`Not quite: ${l}`,seenAgo:s=>s!=null?`replay · seen ${s}s ago`:'replay',seenOnly:s=>`seen ${s}s ago`,fromScan:(n,s)=>`looked back at ${n} frames`+(s!=null?` · seen ${s}s ago`:'')}};
let L=(navigator.language||'zh').startsWith('zh')?'zh':'en';
document.body.classList.toggle('simple',localStorage.getItem('pulse_details')!=='1');
function lbl(s){const m=/^(\W*?\s*)(.+?) · (.+)$/u.exec(s||'');return m?m[1]+(L==='en'?m[3]:m[2]):(s||'')}
const $=id=>document.getElementById(id);
function i18n(){document.querySelectorAll('[data-i]').forEach(e=>{let v=T[L][e.dataset.i];if(typeof v==='string'){if(e.dataset.i==='liveHint')v=v.replace('0.5',String(CAND));e.innerHTML=v}});document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T[L][e.dataset.ph]);
 $('lang').textContent=L==='zh'?'EN':'中文';fetch('/api/lang',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({lang:L})}).catch(()=>{});$('hud').textContent=T[L].watching;$('ideas').innerHTML=T[L].ideas.map(x=>`<span>${x}</span>`).join('');
 $('ideas').querySelectorAll('span').forEach(s=>s.onclick=()=>{$('watchIn').value=s.textContent;addWatch()});renderCounter()}
$('lang').onclick=()=>{L=L==='zh'?'en':'zh';i18n();renderWatches();renderFeed()};
$('details').onclick=()=>{const on=document.body.classList.toggle('simple');localStorage.setItem('pulse_details',on?'0':'1')};
let state={watches:[],moments:[],stats:{frames:0,brain:0}},ws,t0=performance.now();
function renderCounter(){const s=state.stats||{};$('counter').innerHTML=T[L].counter((s.frames||0).toLocaleString(),s.brain||0,s.candidates||0,s.dismissed||0)}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws');ws.binaryType='arraybuffer';
 ws.onmessage=e=>onMsg(JSON.parse(e.data));ws.onclose=()=>setTimeout(connect,1000)}
function onMsg(m){
 if(m.type==='state'){state=m;if(m.candidate&&m.candidate!==CAND){CAND=m.candidate;document.querySelectorAll('[data-i=liveHint]').forEach(e=>e.innerHTML=T[L].liveHint.replace('0.5',String(CAND)))}if(m.engine){$('engine').textContent=m.engine;$('engine').classList.add('on')}renderWatches();renderFeed();renderCounter();$('storage').textContent=`${m.storage_mb} MB`}
 if(m.type==='tick'){state.stats=m.stats;for(const w of state.watches){if(m.probs[w.id]!=null){w.p=m.probs[w.id];(H[w.id]=H[w.id]||[]).push(w.p);if(H[w.id].length>60)H[w.id].shift()}w.active=m.active[w.id]}renderMeters();renderCounter()}
 if(m.type==='moment'){$('check').classList.remove('show');state.moments.push(m.moment);renderFeed(true);celebrate(m.moment)}
 if(m.type==='moment_reel'){const x=state.moments.find(q=>q.id===m.id);if(x){x.reel=m.reel;renderFeed()}}
 if(m.type==='candidate'){const c=$('check');c.classList.remove('no');c.querySelector('span').textContent=T[L].second(lbl(m.label));c.classList.add('show')}
 if(m.type==='verdict'&&!m.ok){const c=$('check');c.classList.add('no');c.querySelector('span').textContent=T[L].notQuite(lbl(m.label));setTimeout(()=>c.classList.remove('show'),1400)}
 if(m.type==='error')console.warn(m.message)}
const H={};
let CAND=0.5;
function spark(h){const n=60,pts=(h||[]).map((p,i)=>`${(n-(h.length-1-i)-1)*100/(n-1)},${(1-p)*34}`);
 return `<svg viewBox="0 0 100 34" preserveAspectRatio="none"><line class="th" x1="0" x2="100" y1="${(1-CAND)*34}" y2="${(1-CAND)*34}"/>`+(pts.length>1?`<polygon class="ar" points="${pts[0].split(',')[0]},34 ${pts.join(' ')} 100,34"/><polyline class="ln" points="${pts.join(' ')}"/>`:'')+`</svg>`}
function renderMeters(){$('meters').innerHTML=[...state.watches.filter(w=>!w.builtin).reverse(),...state.watches.filter(w=>w.builtin)].map(w=>`<div class="meter ${w.active?'on':''}"><div class="n">${lbl(w.label)}</div>${spark(H[w.id])}<div class="v">${(w.p||0).toFixed(2)}</div></div>`).join('')}
function renderWatches(){renderMeters();$('wlist').innerHTML=[...state.watches.filter(w=>!w.builtin).reverse(),...state.watches.filter(w=>w.builtin)].map(w=>`<div class="w${w.builtin?'':' new'}"><span>${lbl(w.label)}<span class="q" title="${w.ask}">${w.ask}</span></span>
 <input type="range" min="5" max="95" value="${Math.round((1-w.threshold)*100)}" title="${T[L].sens}" data-w="${w.id}"><button class="x" data-x="${w.id}">✕</button></div>`).join('');
 $('wlist').querySelectorAll('input[type=range]').forEach(r=>r.onchange=()=>fetch(`/api/watch/${r.dataset.w}/threshold`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({threshold:1-r.value/100})}));
 $('wlist').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>fetch(`/api/watch/${b.dataset.x}`,{method:'DELETE'}))}
function renderFeed(){const f=state.moments.slice().reverse();if(!f.length){$('feed').innerHTML=`<div class="empty">${T[L].noMoments}</div>`;return}
 $('feed').innerHTML=f.map(m=>`<div class="mo"><img src="${m.card}" data-big="${m.card}" data-reel="${m.reel||''}"><div class="a"><button class="s" data-share="${m.card}" data-reel="${m.reel||''}" data-label="${m.label}">${T[L].share}</button><a href="${m.card}" download="pulse-${m.id}.jpg"><button>${T[L].card}</button></a>${m.reel?`<a href="${m.reel}" download="pulse-${m.id}.mp4"><button>${T[L].clip}</button></a>`:''}</div></div>`).join('');
 $('feed').querySelectorAll('img').forEach(i=>i.onclick=()=>{$('lb').innerHTML=i.dataset.reel?`<video src="${i.dataset.reel}" autoplay loop muted playsinline></video>`:`<img src="${i.dataset.big}">`;$('lb').style.display='grid'});
 $('feed').querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>share(b.dataset.share,b.dataset.label,b.dataset.reel))}
$('lb').onclick=()=>$('lb').style.display='none';
async function share(url,label,reel){const text=(L==='zh'?'我告诉摄像头要盯着什么，它就真的注意到了：':'I told my camera what to watch for, in plain words. It noticed: ')+label.replace(/^\W+\s*/,'')+' #Pulse';
 for(const [u,name,type] of [[reel,'pulse-moment.mp4','video/mp4'],[url,'pulse-moment.jpg','image/jpeg']]){if(!u)continue;
  try{const blob=await (await fetch(u)).blob();const file=new File([blob],name,{type});
   if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return}}catch(e){}}
 const a=document.createElement('a');a.href=url;a.download='pulse-moment.jpg';a.click();
 window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text),'_blank')}
function celebrate(m){$('flash').classList.remove('go');void $('flash').offsetWidth;$('flash').classList.add('go');
 $('toast').textContent=T[L].noticed+lbl(m.label);$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}
async function addWatch(){const text=$('watchIn').value.trim();if(!text)return;$('watchGo').disabled=true;const old=$('watchGo').textContent;$('watchGo').textContent='…';
 const r=await fetch('/api/watch',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});$('watchGo').disabled=false;$('watchGo').textContent=old;
 if(r.ok)$('watchIn').value='';else alert((await r.json()).error)}
$('watchGo').onclick=addWatch;$('watchIn').onkeydown=e=>{if(e.key==='Enter')addWatch()};
async function ask(){const q=$('askIn').value.trim();if(!q)return;const a=$('answer');a.style.display='grid';a.innerHTML=`<span class="m">${T[L].thinking}</span>`;
 const r=await (await fetch('/api/ask',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({question:q})})).json();const e=r.evidence||{};
 a.innerHTML=`<b>${r.answer||r.error||''}</b><div class="m"><span class="tech">${T[L].answered((r.ms||0)/1000)}`+(e.frames_scanned!=null?` · ${T[L].fromScan(e.frames_scanned,null)} · </span>`:'</span>')+(e.seconds_ago!=null?T[L].seenOnly(e.seconds_ago):'')+`</div>`+(e.frame?`<img src="${e.frame}" onclick="$('lb').innerHTML=this.outerHTML;$('lb').style.display='grid'">`:'');
 if(e.frame){const rp=$('replay');rp.querySelector('img').src=e.frame;rp.querySelector('span').textContent=T[L].seenAgo(e.seconds_ago);rp.classList.add('show');clearTimeout(window.__rp);window.__rp=setTimeout(()=>rp.classList.remove('show'),7000)}}
$('askGo').onclick=ask;$('askIn').onkeydown=e=>{if(e.key==='Enter')ask()};
$('forget').onclick=async()=>{if(confirm(L==='zh'?'删除所有存下的瞬间和画面？':'Delete all kept moments and frames?'))await fetch('/api/reset',{method:'POST'})};
function voice(btn,input,after){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){btn.style.display='none';return}
 btn.onclick=()=>{const r=new SR();r.lang=L==='zh'?'zh-CN':'en-US';r.interimResults=true;btn.classList.add('on');
  r.onresult=e=>{input.value=[...e.results].map(x=>x[0].transcript).join('')};r.onend=()=>{btn.classList.remove('on');if(input.value.trim())after()};r.start()}}
voice($('watchMic'),$('watchIn'),addWatch);voice($('askMic'),$('askIn'),ask);
async function start(){try{const st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}},audio:false});
  $('video').srcObject=st;$('gate').style.display='none';connect();capture()}catch(e){$('gateErr').textContent=T[L].denied+' ('+e.name+')'}}
function capture(){const v=$('video'),c=document.createElement('canvas'),x=c.getContext('2d');
 setInterval(()=>{if(!v.videoWidth||!ws||ws.readyState!==1)return;const w=640,h=Math.round(v.videoHeight*w/v.videoWidth);c.width=w;c.height=h;x.drawImage(v,0,0,w,h);
  c.toBlob(b=>{if(!b)return;b.arrayBuffer().then(buf=>{const out=new Uint8Array(8+buf.byteLength);new DataView(out.buffer).setFloat64(0,(performance.now()-t0)/1000,true);out.set(new Uint8Array(buf),8);if(ws.readyState===1)ws.send(out)})},'image/jpeg',0.72)},250)}
$('start').onclick=start;i18n();
</script></body></html>
